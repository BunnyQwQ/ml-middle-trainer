name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Fails when any content block is missing a translation, a prerequisite
      # dangles, a quiz answer is not among its choices or a source link points
      # at a domain that was never vetted.
      - name: Check content
        run: npm run check:content

      # Every SQL reference solution is executed on the sample and on all
      # hidden databases, and the checker is probed with wrong answers.
      - name: Run SQL reference solutions
        run: npm run check:sql

      # Every Python reference solution runs against its hidden tests in the
      # same Pyodide build the browser uses.
      - name: Run Python reference solutions
        run: npm run check:py

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
